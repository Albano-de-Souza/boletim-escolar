name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramenta de cobertura
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar testes unitários com cobertura
        run: python -m coverage run --source=src -m unittest discover -s tests -t . -v
      - name: Relatório de cobertura
        run: python -m coverage report -m
